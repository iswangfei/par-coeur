<meta name="theme-color" content="#10132A" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --paper:#F3F4F0; --sheet:#FFFFFF; --ink:#1D2757; --ink-2:#48507C; --muted:#7B809A;
  --rule:#DCE2F1; --rule-strong:#C3CCE6; --margin:#E7A19C; --line:#E2E4EC;
  --accent:#2B3FA0; --accent-ink:#FFFFFF; --accent-soft:#E6E9F7;
  --err:#C4302A; --err-bg:#FBE3E0; --ok:#1F6E4C; --ok-bg:#DDF0E6; --warn:#A5620B; --warn-bg:#FBEBD3;
  --heat0:#E6E8EF; --heat1:#C7CEEB; --heat2:#8D9BDB; --heat3:#4A5DC0; --heat4:#24358F;
  --serif:"Literata","Songti SC","Noto Serif CJK SC","Hiragino Mincho ProN",Georgia,serif;
  --sans:"Figtree","PingFang SC","Hiragino Sans","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10132A; --sheet:#171B35; --ink:#E5E8F7; --ink-2:#B6BCDD; --muted:#868CAD;
    --rule:#232948; --rule-strong:#2E3560; --margin:#6E3438; --line:#262B4A;
    --accent:#93A4FF; --accent-ink:#10132A; --accent-soft:#232A55;
    --err:#FF7B70; --err-bg:#3B1C22; --ok:#6FD4A2; --ok-bg:#15332A; --warn:#F2B25C; --warn-bg:#3A2A14;
    --heat0:#1E2342; --heat1:#2C3570; --heat2:#44529E; --heat3:#6D80E0; --heat4:#A8B5FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10132A; --sheet:#171B35; --ink:#E5E8F7; --ink-2:#B6BCDD; --muted:#868CAD;
  --rule:#232948; --rule-strong:#2E3560; --margin:#6E3438; --line:#262B4A;
  --accent:#93A4FF; --accent-ink:#10132A; --accent-soft:#232A55;
  --err:#FF7B70; --err-bg:#3B1C22; --ok:#6FD4A2; --ok-bg:#15332A; --warn:#F2B25C; --warn-bg:#3A2A14;
  --heat0:#1E2342; --heat1:#2C3570; --heat2:#44529E; --heat3:#6D80E0; --heat4:#A8B5FF;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:12px;height:54px}
.brand{font-family:var(--serif);font-style:italic;font-weight:600;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--err);font-style:normal}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:7px 11px;border-radius:8px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.on::before{background:var(--ok)}
@media (max-width:620px){.sync{display:none}.brand{font-size:18px}.tab{padding:7px 9px}}

main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--rule-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--err)}
.btn.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--sheet);padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.chip.due{background:var(--warn-bg);color:var(--warn)}
.chip.sample{background:var(--ok-bg);color:var(--ok)}

/* library */
.lib-head{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3;word-break:break-word}
.card .ex{font-family:var(--serif);color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .row{margin-top:2px}
.drop{border:1.5px dashed var(--rule-strong);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);font-size:13.5px}
.drop.hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* editor */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:9px 12px;width:100%}
textarea.input{min-height:320px;font-family:var(--serif);font-size:16px;line-height:1.7;resize:vertical}

/* practice sheet: Seyès ruling */
.sheet{position:relative;background-color:var(--sheet);border:1px solid var(--line);border-radius:var(--r);
  background-image:linear-gradient(to right,transparent 38px,var(--margin) 38px,var(--margin) 39.5px,transparent 39.5px),
    repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-strong) 31px 32px),
    repeating-linear-gradient(to bottom,transparent 0 7px,var(--rule) 7px 8px);
  background-position:0 0,0 14px,0 14px;padding:14px 18px 20px 52px}
@media (max-width:520px){.sheet{padding-left:30px;background-image:linear-gradient(to right,transparent 18px,var(--margin) 18px,var(--margin) 19.5px,transparent 19.5px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-strong) 31px 32px),repeating-linear-gradient(to bottom,transparent 0 7px,var(--rule) 7px 8px)}}
.prose{font-family:var(--serif);font-size:17px;line-height:32px;white-space:pre-wrap;word-break:break-word}
.blank-wrap{white-space:nowrap}
.blank{font-family:var(--serif);font-size:17px;border:0;border-bottom:2px solid var(--accent);background:color-mix(in srgb,var(--accent-soft) 70%,transparent);border-radius:4px 4px 0 0;padding:0 3px;height:26px;vertical-align:baseline;text-align:center;outline:none;min-width:2.2ch}
.blank:focus{background:var(--accent-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.blank.ok{border-bottom-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.blank.bad{border-bottom-color:var(--err);background:var(--err-bg);color:var(--err)}
.blank.shown{border-bottom-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.hintpre{color:var(--accent);font-weight:600}
.pick{-webkit-user-select:none;user-select:none}
.pw{cursor:pointer;border-radius:4px;padding:1px 1px;-webkit-tap-highlight-color:transparent}
.pw:hover{background:var(--accent-soft)}
.pw.on{background:var(--accent);color:var(--accent-ink)}
.weak{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.ws{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ws:last-child{border-bottom:0}
.ws input{margin-top:6px;accent-color:var(--accent);flex:none;width:17px;height:17px}
.ws span.s{flex:1;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.ws span.n{color:var(--err);font-weight:700;font-size:12.5px;white-space:nowrap;margin-top:4px;font-variant-numeric:tabular-nums}
.chip.smart{background:var(--err-bg);color:var(--err)}

.pbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:5;background:var(--paper);padding-block:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex-basis:100%}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);font-weight:600}
.ptitle{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}

.typearea{width:100%;min-height:220px;border:0;background:transparent;resize:vertical;font-family:var(--serif);font-size:17px;line-height:32px;outline:none;padding:0}
.ref{font-family:var(--serif);font-size:16px;line-height:30px;white-space:pre-wrap;color:var(--ink-2);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;max-height:40vh;overflow:auto}
.ref .fl{color:var(--ink)}
.ref .rest{color:var(--rule-strong);letter-spacing:.05em}
.live{font-family:var(--serif);font-size:16px;line-height:30px;white-space:pre-wrap;word-break:break-word;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.d-ins{color:var(--err);background:var(--err-bg);text-decoration:line-through;text-decoration-thickness:1px;border-radius:2px}
.d-del{color:var(--err);border-bottom:2px solid var(--err);opacity:.9}
.d-gap{display:inline-block;width:.5em;border-bottom:2px solid var(--err);margin:0 1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.result{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big.good{color:var(--ok)} .big.mid{color:var(--warn)} .big.bad{color:var(--err)}
.misslist{display:flex;flex-wrap:wrap;gap:6px}
.misslist span{font-family:var(--serif);background:var(--err-bg);color:var(--err);padding:1px 8px;border-radius:5px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{font-size:12.5px;color:var(--muted)}
.heat-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--heat0)}
.heat i.l1{background:var(--heat1)}.heat i.l2{background:var(--heat2)}.heat i.l3{background:var(--heat3)}.heat i.l4{background:var(--heat4)}
.heat i.fut{background:transparent}
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.t{white-space:normal;min-width:140px;font-family:var(--serif)}

/* settings */
.set{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.set-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .d{font-size:12.5px;color:var(--muted)}
.switch{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className = v;
    else if (k==="text") el.textContent = v;
    else if (k==="style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k in el && typeof v !== "string") el[k] = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  for (const c of kids.flat(3)){ if (c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const DAY = 864e5;
const sod = (ms) => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const dayKey = (ms) => { const d = new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const monthKey = (ms) => dayKey(ms).slice(0,7);
const uid = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pct = (x) => Math.round(x*100) + "%";
const fmtSecs = (s) => { s = Math.round(s); const m = Math.floor(s/60); return m ? m+":"+String(s%60).padStart(2,"0") : s+"s"; };
function fmtDate(ms){ try { return new Intl.DateTimeFormat(locale(), {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(ms); } catch { return dayKey(ms); } }
function fmtDue(ms){
  if (!ms) return t("later");
  const d = Math.round((sod(ms) - sod(Date.now()))/DAY);
  if (d <= 0) return t("today");
  return "+" + d + t("days");
}

const chains = {};
function queue(path, fn){
  const p = (chains[path] || Promise.resolve()).then(fn).catch(e => { console.error(e); toast(e && e.code==="quota_exceeded" ? e.message : t("saveFail")); });
  chains[path] = p; return p;
}
function putText(x){
  x.updatedAt = Date.now(); state.texts.set(x.id, x);
  if (db) return queue("texts/"+x.id, () => db.doc("texts/"+x.id).set(JSON.parse(JSON.stringify(x))));
  saveLocal();
}
function removeText(id){
  state.texts.delete(id);
  if (db) return queue("texts/"+id, () => db.doc("texts/"+id).delete());
  saveLocal();
}
function addLog(entry){
  const mk = monthKey(entry.at);
  const arr = [...(state.logs.get(mk)||[]), entry];
  state.logs.set(mk, arr);
  if (db) return queue("logs/"+mk, () => db.doc("logs/"+mk).set({entries:arr}));
  saveLocal();
}
function putSettings(){
  if (db) return queue("settings/main", () => db.doc("settings/main").set({...state.settings}));
  saveLocal();
}
function allLogs(){ return [...state.logs.values()].flat().sort((a,b)=>b.at-a.at); }

async function connectCloud(){ /* unused in the offline build */
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") return;
  let d; try { d = await cl.use("db"); } catch { d = null; }
  if (!d) return;
  const local = { texts:[...state.texts.values()], logs:new Map(state.logs) };
  db = d; state.cloud = true; updateSync();
  let first = true;
  db.collection("texts").onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(doc => { const v = doc.data(); if (v) m.set(doc.id, JSON.parse(JSON.stringify(v))); });
    state.texts = m;
    if (first){
      first = false;
      // one-time move of anything created before the cloud connected
      local.texts.filter(x => !m.has(x.id)).forEach(x => putText(x));
      local.logs.forEach((arr, mk) => { if (!state.logs.has(mk)) { state.logs.set(mk, arr); queue("logs/"+mk, () => db.doc("logs/"+mk).set({entries:arr})); } });
      try { localStorage.removeItem(LS_KEY); } catch {}
    }
    softRender();
  }, e => console.error(e));
  db.collection("logs").onSnapshot(snap => {
    snap.docs.forEach(doc => { const v = doc.data(); if (v && Array.isArray(v.entries)) state.logs.set(doc.id, v.entries.map(x=>({...x}))); });
    softRender();
  }, e => console.error(e));
  db.doc("settings/main").onSnapshot(s => {
    if (s.exists) Object.assign(state.settings, s.data());
    softRender();
  }, e => console.error(e));
}
function updateSync(){
  const s = $("#sync"); s.textContent = state.cloud ? t("cloud") : t("local"); s.classList.toggle("on", state.cloud);
}

/* ---------- text processing ---------- */
function segment(text, lang){
  const loc = lang && lang !== "other" ? lang : undefined;
  if (typeof Intl !== "undefined" && Intl.Segmenter){
    const seg = new Intl.Segmenter(loc, {granularity:"word"});
    return Array.from(seg.segment(text), s => ({s:s.segment, w:!!s.isWordLike}));
  }
  return text.split(/([\p{L}\p{N}][\p{L}\p{M}\p{N}'’\-]*)/u).filter(Boolean).map(s => ({s, w:/^[\p{L}\p{N}]/u.test(s)}));
}
const graphemes = (s) => { try { return Array.from(new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s), x=>x.segment); } catch { return Array.from(s); } };
const isWide = (c) => /[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\uFFE0-\uFFE6\u3000-\u30FF]/.test(c);
const dispWidth = (s) => Array.from(s).reduce((n,c)=>n+(isWide(c)?2:1),0);

function normChar(c){
  let x = c;
  if (/[’‘ʼ`´′]/.test(x)) x = "'";
  else if (/[“”«»„]/.test(x)) x = '"';
  else if (/[‐‑–—]/.test(x)) x = "-";
  else if (/\s/.test(x)) x = " ";
  if (state.settings.ignoreCase) x = x.toLowerCase();
  if (state.settings.ignoreAccents) x = x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC");
  if (state.settings.ignoreAccents){ x = x.replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/æ/g,"ae"); }
  return x;
}
const normWord = (s) => Array.from(s.normalize("NFC").trim()).map(normChar).join("").replace(/ +/g," ");

// normalized string + index map back to the original, for full recall diffing
function normMapped(src, dropPunct){
  const out = [], map = [];
  const chars = Array.from(src.normalize("NFC"));
  let prevSpace = true;
  chars.forEach((c, i) => {
    if (dropPunct && /[\p{P}\p{S}]/u.test(c) && !/['’-]/.test(c)) return;
    let n = normChar(c);
    if (n === " "){ if (prevSpace) return; prevSpace = true; }
    else prevSpace = false;
    for (const ch of Array.from(n)){ out.push(ch); map.push(i); }
  });
  while (out.length && out[out.length-1] === " "){ out.pop(); map.pop(); }
  return {s:out.join(""), map, chars};
}

// segments with code-point offsets, matching the indices normMapped() uses
function spans(text, lang, gran){
  let segs;
  if (gran === "sentence"){
    try { segs = Array.from(new Intl.Segmenter(lang && lang !== "other" ? lang : undefined, {granularity:"sentence"}).segment(text), k => ({s:k.segment})); }
    catch { segs = text.split(/(?<=[.!?。！？…]["»”）)]*\s*)/).filter(Boolean).map(s => ({s})); }
  } else segs = segment(text, lang);
  let off = 0;
  return segs.map(k => { const L = Array.from(k.s).length, o = {...k, start:off, end:off+L}; off += L; return o; });
}
// recent misses for one text, newer sessions weighing more
function missWeights(x){
  const m = new Map();
  allLogs().filter(l => l.id === x.id).slice(0, 10).forEach((l, i) =>
    (l.miss||[]).forEach(w => { const k = normWord(w); m.set(k, (m.get(k)||0) + (1 - i*0.07)); }));
  return m;
}

function guessLang(s){
  if (/[\u3040-\u30ff]/.test(s)) return "ja";
  if (/[\u4e00-\u9fff]/.test(s)) return "zh";
  const low = " " + s.toLowerCase().slice(0,3000) + " ";
  const fr = (low.match(/ (le|la|les|des|est|et|une|que|pour|dans|ce|qui|pas) /g)||[]).length + (low.match(/[éèêàçùâîôœ]/g)||[]).length;
  const en = (low.match(/ (the|and|is|of|to|in|that|it|for|with|was) /g)||[]).length;
  if (/[äöüß]/.test(low) && fr < 5) return "de";
  if (/[ñ¿¡]/.test(low)) return "es";
  return fr > en ? "fr" : "en";
}

/* ---------- spaced review ---------- */
function newText(title, content, lang){
  content = content.normalize("NFC");
  return {id:uid(), title:title || t("emptyTitle"), lang:lang || guessLang(content), content, createdAt:Date.now(), updatedAt:Date.now(),
    stats:{attempts:0, best:0, last:0, lastAt:0}, srs:{due:0, interval:0, ease:2.5, reps:0}, cloze:0.3};
}
function applyResult(x, mode, acc, ratio, manual){
  x.stats = {...x.stats, attempts:(x.stats.attempts||0)+1, last:acc, lastAt:Date.now(),
    best: (mode==="full" || ratio>=0.99) ? Math.max(x.stats.best||0, acc) : (x.stats.best||0)};
  if (mode === "cloze" && !manual){
    if (acc >= 0.9) x.cloze = Math.min(1, Math.round((ratio+0.2)*10)/10);
    else if (acc < 0.6) x.cloze = Math.max(0.1, Math.round((ratio-0.2)*10)/10);
    else x.cloze = ratio;
  }
  const counts = mode === "full" || ratio >= 0.6;
  const s = {...x.srs}, now = Date.now();
  if (!counts){ if (!s.due) s.due = sod(now) + DAY; x.srs = s; return; }
  if (acc >= 0.9){ s.reps = (s.reps||0)+1; s.interval = s.reps===1 ? 1 : s.reps===2 ? 3 : Math.round(s.interval*s.ease); if (acc>=0.98) s.ease = Math.min(3, s.ease+0.1); }
  else if (acc >= 0.7){ s.interval = Math.max(1, Math.round((s.interval||1)*1.2)); s.ease = Math.max(1.3, s.ease-0.15); }
  else { s.reps = 0; s.interval = 0; s.ease = Math.max(1.3, s.ease-0.2); }
  s.due = s.interval === 0 ? now : sod(now) + s.interval*DAY;
  x.srs = s;
}
const isDue = (x) => !!(x.srs && x.srs.due && x.srs.due <= Date.now());

/* ---------- speech ---------- */
function speak(text, lang, btn){
  const ss = window.speechSynthesis; if (!ss) return;
  if (ss.speaking){ ss.cancel(); if (btn) btn.textContent = t("speak"); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ({fr:"fr-FR",en:"en-GB",ja:"ja-JP",zh:"zh-CN",de:"de-DE",es:"es-ES"})[lang] || "";
  u.rate = state.settings.rate || 0.9;
  u.onend = u.onerror = () => { if (btn) btn.textContent = t("speak"); };
  if (btn) btn.textContent = t("stop");
  try { ss.speak(u); } catch {}
}

async function pdfText(buf){

  const doc = await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
  const paras = []; let cur = "";
  const endPara = () => { if (cur.trim()) paras.push(cur.trim()); cur = ""; };
  for (let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    const lines = []; let ln = null;
    for (const it of tc.items){

      ln.t += it.str;
      if (it.hasEOL) ln = null;
    }
    let prevY = null, prevH = 0;
    for (const l of lines){
      const s = l.t.replace(/\s+/g," ").trim();
      if (!s || /^[-–—\s]*\d{1,4}[-–—\s]*$/.test(s)) continue; // blank lines and page numbers

  const ta = h("textarea",{class:"typearea",id:"full-input",lang:x.lang,placeholder:t("startTyping"),autocomplete:"off",autocapitalize:"sentences",autocorrect:"off",spellcheck:"false"});
  const draft = lsGet("pc.draft."+x.id); if (draft) ta.value = draft;
  const livePanel = h("div",{class:"live",lang:x.lang});
  const liveWrap = h("div",{class:"stack",style:"gap:6px"}, h("div",{class:"legend"}, h("span",null, h("span",{class:"d-ins",text:"abc"})," "+t("legendIns")), h("span",null, h("span",{class:"d-gap"})," "+t("legendDel"))), livePanel);
  const countEl = h("span",{class:"count"});
  let composing = false, timer;
  function update(){
    lsSet("pc.draft."+x.id, ta.value);
    const tl = normMapped(x.content, state.settings.ignorePunct).s.length;
    const yl = normMapped(ta.value, state.settings.ignorePunct).s.length;
    countEl.textContent = Math.min(yl, tl) + " / " + tl;
    liveWrap.hidden = !live || !ta.value.trim();
    if (live && ta.value.trim()) renderDiff(livePanel, x.content, ta.value, true);
  }
  ta.addEventListener("compositionstart", () => composing = true);
  ta.addEventListener("compositionend", () => { composing = false; update(); });
  ta.addEventListener("input", () => { if (!started) started = Date.now(); if (composing) return; clearTimeout(timer); timer = setTimeout(update, 120); });
  const liveBtn = h("button",{class:"btn sm","aria-pressed":String(live),onclick:()=>{ live = !live; lsSet("pc.live", live); liveBtn.textContent = (live?"✓ ":"")+t("liveCheck"); update(); }}, (live?"✓ ":"")+t("liveCheck"));
  const resultBox = h("div",{hidden:true});
  function finish(){
    if (done || !ta.value.trim()) return; done = true;
    const box = h("div",{class:"live",lang:x.lang});
    const r = renderDiff(box, x.content, ta.value, false);
    const score = Math.max(0, 1 - r.lev / Math.max(1, r.total));
    const secs = started ? (Date.now()-started)/1000 : 0;
    const hit = (a, b) => { for (let k=a;k<b;k++) if (r.errPos.has(k)) return true; return false; };
    const words = spans(x.content, x.lang, "word");
    const missIdx = words.map((w,i) => w.w && hit(w.start, w.end) ? i : -1).filter(i => i >= 0);
    const miss = [...new Set(missIdx.map(i => words[i].s))].slice(0, 40);
    const y = {...x}; applyResult(y, "full", score, 1); putText(y);
    addLog({id:x.id, title:x.title, mode:"full", ratio:1, acc:Math.round(score*1000)/1000, secs:Math.round(secs), at:Date.now(), miss});
    const weak = spans(x.content, x.lang, "sentence").filter(sn => sn.s.trim()).map(sn => {
      let n = 0; for (let k=sn.start;k<sn.end;k++) if (r.errPos.has(k)) n++;
      return {...sn, n};
    }).filter(sn => sn.n > 0);
    const boxes = weak.map(() => h("input",{type:"checkbox",checked:true}));
    const drill = (whole) => {
      const picked = weak.filter((sn, i) => boxes[i].checked);
      const idx = words.map((w,i) => i).filter(i => words[i].w && picked.some(sn => words[i].start >= sn.start && words[i].start < sn.end) && (whole || missIdx.includes(i)));
      if (!idx.length){ toast(t("needPick")); return; }
      const cur = state.texts.get(x.id) || y;
      putText({...cur, manual:idx.map(i => [i, words[i].s])});
      go({name:"cloze", id:x.id, ratio:"manual"});
    };
    const weakBox = weak.length ? h("section",{class:"stack",style:"gap:8px"},
      h("h2",{text:t("weakSent")+" · "+weak.length}),
      h("div",{class:"small muted",text:t("weakNote")}),
      h("div",{class:"weak"}, weak.map((sn, i) => h("label",{class:"ws"}, boxes[i], h("span",{class:"s",lang:x.lang,text:sn.s.trim()}), h("span",{class:"n",text:"✗ "+sn.n})))),
      h("div",{class:"row"},
        h("button",{class:"btn primary",onclick:()=>drill(false)}, t("blankMissed")),
        h("button",{class:"btn",onclick:()=>drill(true)}, t("blankSent")))) : null;
    lsSet("pc.draft."+x.id, "");
    ta.readOnly = true; liveWrap.hidden = true;
    resultBox.replaceChildren(h("div",{class:"stack"},
      resultCard(score, secs, miss, [
        h("button",{class:"btn primary",onclick:()=>go({name:"full",id:x.id})}, t("again")),
        h("button",{class:"btn",onclick:()=>go({name:"cloze",id:x.id})}, t("cloze"))
      ]),
      weakBox,
      h("div",{class:"legend"}, h("span",null, h("span",{class:"d-ins",text:"abc"})," "+t("legendIns")), h("span",null, h("span",{class:"d-del",text:"abc"})," "+t("legendDel"))),
      box));
    resultBox.hidden = false;
    resultBox.scrollIntoView({behavior:"smooth",block:"start"});
  }
  drawRef();
  const el = h("div",{class:"stack"},
    h("div",{class:"ptitle"}, h("button",{class:"btn ghost sm",onclick:()=>go({name:"library"})}, "← "+t("back")), h("h1",{text:x.title}), h("span",{class:"chip",text:t("full")})),
    h("div",{class:"pbar"},
      h("span",{class:"small muted",text:t("ref")}), h("div",{class:"seg"}, segBtns), liveBtn,
      h("button",{class:"btn sm",onclick:e=>speak(x.content, x.lang, e.currentTarget)}, t("speak")),
      h("span",{class:"spacer"}), countEl,
      h("button",{class:"btn primary sm",onclick:finish}, t("submit"))),
    resultBox,
    ref,
    h("div",{class:"sheet"}, ta),
    liveWrap
  );
  setTimeout(update, 0);
  return el;
}

/* ---------- stats ---------- */
function renderStats(){
  const logs = allLogs();
  const byDay = new Map();
  logs.forEach(l => { const k = dayKey(l.at); const v = byDay.get(k) || {n:0, secs:0}; v.n++; v.secs += l.secs||0; byDay.set(k, v); });
  let streak = 0; { let d = sod(Date.now()); if (!byDay.has(dayKey(d))) d -= DAY; while (byDay.has(dayKey(d))){ streak++; d -= DAY; } }
  const weekStart = sod(Date.now()) - ((new Date().getDay()+6)%7)*DAY;
  const weekMin = Math.round(logs.filter(l => l.at >= weekStart).reduce((s,l)=>s+(l.secs||0),0)/60);
  const texts = [...state.texts.values()];
  const dueN = texts.filter(isDue).length;

  // heatmap: 20 weeks, Monday-first columns
  const heat = h("div",{class:"heat",role:"img","aria-label":t("activity")});
  const today = sod(Date.now());
  const start = today - ((new Date().getDay()+6)%7)*DAY - 19*7*DAY;
  for (let d = start; d < start + 20*7*DAY; d += DAY){
    const v = byDay.get(dayKey(d)); const n = v ? v.n : 0;
    const lvl = d > today ? "fut" : n===0 ? "" : n<2 ? "l1" : n<4 ? "l2" : n<7 ? "l3" : "l4";
    heat.append(h("i",{class:lvl,title:dayKey(d)+" · "+n}));
  }
  const hard = new Map();
  logs.forEach(l => (l.miss||[]).forEach(w => hard.set(w, (hard.get(w)||0)+1)));
  const hardList = [...hard.entries()].filter(([,n])=>n>=1).sort((a,b)=>b[1]-a[1]).slice(0,30);

  if (!logs.length) return h("div",{class:"stack"}, h("h1",{text:t("stats")}), h("p",{class:"muted",text:t("noData")}),
    h("div",{class:"heat-wrap"}, h("h2",{text:t("activity"),style:"margin-bottom:10px"}), heat));

  return h("div",{class:"stack",style:"gap:22px"},
    h("h1",{text:t("stats")}),
    h("div",{class:"tiles"},
      [[streak,t("streak")],[weekMin,t("week")],[logs.length,t("sessions")],[dueN,t("dueCount")]].map(([v,l]) => h("div",{class:"tile"}, h("b",{text:v}), h("span",{text:l})))),
    h("div",{class:"heat-wrap"}, h("h2",{text:t("activity"),style:"margin-bottom:10px"}), heat),
    h("section",{class:"section",style:"margin:0"}, h("h2",{text:t("perText")}),
      h("div",{class:"tbl-wrap"}, h("table",null,
        h("thead",null, h("tr",null, [t("title"),t("attempts"),t("best"),t("cloze"),t("next")].map(s=>h("th",{text:s})))),
        h("tbody",null, texts.sort((a,b)=>(a.srs.due||9e15)-(b.srs.due||9e15)).map(x => h("tr",null,
          h("td",{class:"t",text:x.title}), h("td",{text:x.stats.attempts||0}), h("td",{text:x.stats.attempts ? pct(x.stats.best||0) : "—"}),
          h("td",{text:pct(x.cloze||0.3)}), h("td",{text:fmtDue(x.srs.due)}))))))),
    hardList.length ? h("section",{class:"section",style:"margin:0"}, h("h2",{text:t("hard")}),
      h("div",{class:"misslist"}, hardList.map(([w,n]) => h("span",{text:w+" ×"+n})))) : null,
    h("section",{class:"section",style:"margin:0"}, h("h2",{text:t("recent")}),
      h("div",{class:"tbl-wrap"}, h("table",null,
        h("thead",null, h("tr",null, [t("when"),t("title"),t("mode"),t("accuracy"),t("time")].map(s=>h("th",{text:s})))),
        h("tbody",null, logs.slice(0,30).map(l => h("tr",null,
          h("td",{text:fmtDate(l.at)}), h("td",{class:"t",text:(state.texts.get(l.id)||l).title}),
          h("td",{text:l.mode==="full" ? t("full") : l.manual ? t("manual") : t("cloze")+" "+pct(l.ratio||0)}),
          h("td",{text:pct(l.acc)}), h("td",{text:fmtSecs(l.secs||0)}))))))),
    h("p",{class:"small muted",text:t("srsNote")})
  );
}

/* ---------- settings ---------- */
function toggleRow(key, label, desc){
  const cb = h("input",{type:"checkbox",class:"switch",id:"set-"+key,checked:!!state.settings[key],onchange:e=>{ state.settings[key] = e.target.checked; putSettings(); }});
  return h("div",{class:"set-row"}, h("label",{for:"set-"+key}, h("div",{text:label}), desc && h("div",{class:"d",text:desc})), cb);
}
async function exportBackup(){
  const data = JSON.stringify({app:"par-coeur", version:1, exportedAt:new Date().toISOString(), texts:[...state.texts.values()], logs:Object.fromEntries(state.logs), settings:state.settings}, null, 2);
  const name = "par-coeur-" + dayKey(Date.now()) + ".json";
  let dl = null; try { dl = window.claude && await window.claude.use("downloads"); } catch {}
  if (dl){ try { await dl.save({filename:name, data}); } catch (e){ if (e && e.code !== "declined") toast(e.message || "export failed"); } return; }
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  const a = h("a",{href:url, download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
$("#backupin").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.texts)) throw 0;
    d.texts.forEach(x => { if (x && x.id && x.content) putText({...newText(x.title, x.content, x.lang), ...x}); });
    for (const [mk, arr] of Object.entries(d.logs||{})){
      if (!Array.isArray(arr)) continue;
      const cur = state.logs.get(mk) || [];
      const seen = new Set(cur.map(l => l.at+":"+l.id));
      const merged = cur.concat(arr.filter(l => !seen.has(l.at+":"+l.id))).sort((a,b)=>a.at-b.at);
      state.logs.set(mk, merged);
      if (db) queue("logs/"+mk, () => db.doc("logs/"+mk).set({entries:merged}));
    }
    saveLocal(); toast(t("restored")); render();
  } catch { toast(t("fileFail")); }
});

  const rateOut = h("span",{class:"count",text:"×"+(state.settings.rate||0.9)});
  return h("div",{class:"stack",style:"gap:18px"},

    h("div",{class:"set"},
      h("div",{class:"set-row"}, h("label",{for:"set-ui",text:t("uiLang")}), ui),
      toggleRow("smart", t("smart"), t("smartD")),
      toggleRow("ignoreCase", t("ignoreCase")),
      toggleRow("ignoreAccents", t("ignoreAccents"), t("ignoreAccentsD")),
      toggleRow("ignorePunct", t("ignorePunct")),
      h("div",{class:"set-row"}, h("label",{for:"set-rate",text:t("rate")}), h("div",{class:"row"}, rate, rateOut))),
    h("div",{class:"set"},
      h("div",{class:"set-row"}, h("div",null, h("div",{text:t("storage")+" · "+(state.cloud?t("cloud"):t("local"))}), h("div",{class:"d",text:state.cloud?t("cloudD"):t("localD")}))),
      h("div",{class:"set-row"}, h("div",null, h("div",{text:t("exportB")}), h("div",{class:"d",text:t("exportD")})), h("button",{class:"btn sm",onclick:exportBackup}, t("exportB"))),
      h("div",{class:"set-row"}, h("div",null, h("div",{text:t("importB")}), h("div",{class:"d",text:t("importD")})), h("button",{class:"btn sm",onclick:()=>$("#backupin").click()}, t("importB"))))
  );
}
